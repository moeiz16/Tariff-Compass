[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tariffcompass"
version = "0.1.0"
description = "Tariff classification for US and Canadian imports, with the customs rulings that back each code and every duty layer explained."
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Moeiz Shahzad" }]
# Exact pins; the resolved set is frozen in requirements.lock (make lock). See docs/adr/0001.
dependencies = [
  # web + platform
  "Django==5.2.19",
  "django-ninja==1.8.0",
  "pydantic==2.14.3",
  "argon2-cffi==25.1.0",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "uvicorn==0.54.0",
  # background jobs (SQLite storage)
  "huey==3.5.4",
  # search engine (BM25 over rulings and tariff text)
  "tantivy==0.27.0",
  # the classifier program and its optimiser
  "dspy==3.5.0",
  "gepa==0.1.4",
  # classical first stage and baseline
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "optuna==5.0.0",
  "mlflow-skinny==3.18.0",
  # documents: spec-sheet text in, binder PDF out
  "pypdf==7.1.0",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
# Live cloud calls (LLM_FAKE=false + a free-tier key). Not needed offline.
ai = ["litellm==1.109.1"]
postgres = ["psycopg[binary]==3.3.9"]
dev = [
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.5",
  "mypy==1.19.1",
  "django-stubs==5.2.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tariffcompass*"]

[tool.setuptools.package-data]
tariffcompass = ["**/*.json", "**/*.jsonl", "**/*.md"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "tariffcompass.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tariffcompass.settings"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: model training, optimisation or index builds (deselect with -m 'not slow')",
]
filterwarnings = ["ignore::DeprecationWarning:mlflow.*", "ignore::FutureWarning:mlflow.*"]
