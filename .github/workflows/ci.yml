name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API, platform, search, classifier and duties
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: test
      LLM_FAKE: "true"
      VISION_FAKE: "true"
      EMBEDDINGS: fake
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (pinned lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e ".[dev]"
      - name: Lint
        run: |
          cd .. && python -m ruff check backend scripts && python -m ruff format --check backend scripts
          if [ -d eval ]; then python -m ruff check eval && python -m ruff format --check eval; fi
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: sqlite:///data/ci.db
        run: |
          python manage.py migrate -v0
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest --cov=tariffcompass --cov-report=term-missing:skip-covered
      - name: Toolchain smoke (DSPy + GEPA offline, Tantivy, ML stack, Huey)
        run: |
          python ../scripts/smoke/dspy_gepa_smoke.py
          python ../scripts/smoke/stack_smoke.py
      - name: Demo seed runs offline
        env:
          DATABASE_URL: sqlite:///data/ci-seed.db
          TARIFF_COMPASS_DEMO_TODAY: "2026-02-19"
        run: |
          python manage.py migrate -v0
          if grep -q "not implemented yet" tariffcompass/seed/management/commands/seed.py; then echo "seed not implemented yet"; else python manage.py seed; fi
      - name: Evaluation gates
        run: |
          if [ -f ../eval/run.py ]; then python ../eval/run.py; else echo "eval harness not implemented yet"; fi

  frontend:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
