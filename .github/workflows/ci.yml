name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API, platform, search, classifier and duties
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: test
      LLM_FAKE: "true"
      VISION_FAKE: "true"
      EMBEDDINGS: fake
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (pinned lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e ".[dev]"
      - name: Lint
        run: |
          cd .. && python -m ruff check backend scripts && python -m ruff format --check backend scripts
          if [ -d eval ]; then python -m ruff check eval && python -m ruff format --check eval; fi
      - name: Type check
        run: python -m mypy tariffcompass
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: sqlite:///data/ci.db
        run: |
          python manage.py migrate -v0
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest --cov=tariffcompass --cov-report=term-missing:skip-covered
      - name: Toolchain smoke (DSPy + GEPA offline, Tantivy, ML stack, Huey)
        run: |
          python ../scripts/smoke/dspy_gepa_smoke.py
          python ../scripts/smoke/stack_smoke.py
      - name: Demo seed runs offline
        env:
          DATABASE_URL: sqlite:///data/ci-seed.db
          TARIFF_COMPASS_DEMO_TODAY: "2026-02-19"
        run: |
          python manage.py migrate -v0
          python manage.py seed
      # Release gates (what is in use) fail the build; promotion checks (may a challenger round go live?) are
      # reported in the report and never fail it. See eval/gates.toml.
      - name: Evaluation (release gates)
        run: python ../eval/run.py
      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            eval/RESULTS.md
            eval/report.json
          if-no-files-found: warn

  frontend:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
